<section class="section">
  <div class="narrow">
    <form class="form-card" data-form="הצטרפות למועדון הלקוחות" novalidate>
      <h2>להצטרפות מלאו את הטופס</h2>
      <div class="form-grid two">
        <div class="field"><label for="cl-first">שם פרטי *</label><input id="cl-first" name="first_name" type="text" autocomplete="given-name" required></div>
        <div class="field"><label for="cl-last">שם משפחה *</label><input id="cl-last" name="last_name" type="text" autocomplete="family-name" required></div>
        <div class="field"><label for="cl-phone">טלפון *</label><input id="cl-phone" name="phone" type="tel" autocomplete="tel" required></div>
        <div class="field"><label for="cl-email">אימייל</label><input id="cl-email" name="email" type="email" autocomplete="email"></div>
        <div class="field"><label for="cl-bday">תאריך לידה</label><input id="cl-bday" name="birthday" type="date"></div>
        <div class="field"><label for="cl-anniv">תאריך נישואין</label><input id="cl-anniv" name="anniversary" type="date"></div>
        <label class="check full"><input type="checkbox" name="consent" required> <span>אני מאשר/ת לצרפתי מעושנים בע״מ לשלוח אליי דבר פרסומת בדואר אלקטרוני, SMS או בכל אמצעי אלקטרוני אחר, כהגדרתו בחוק. ידוע לי שאוכל להסיר את עצמי מרשימת התפוצה בכל עת. *</span></label>
      </div>
      <button type="submit" class="btn btn--gold btn--block mt-2">הצטרפות</button>
      <p class="small muted mt-2 mb-0">צרפתי רשאית לשנות את הטבות המועדון לפי שיקול דעתה. פרטיכם נשמרים בהתאם ל<a href="/תקנון/">מדיניות הפרטיות</a>.</p>
      <div class="form-status" role="status" aria-live="polite"></div>
    </form>
  </div>
</section>
