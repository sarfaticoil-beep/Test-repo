<!--
path: /יצירת-קשר/
title: יצירת קשר – טלפון, כתובת ושעות פתיחה
description: צרו קשר עם צרפתי דגים מעושנים: חנות המפעל בשילת (08-6825888) וסניף שרונה מרקט בתל אביב (03-5252552). שעות פתיחה, ניווט וטופס פנייה.
hero_title: יצירת קשר
hero_intro: נשמח לעזור – בטלפון, בוואטסאפ או בטופס.
schema: business
-->
<section class="section">
  <div class="wrap split" style="align-items:start">
    <div class="stack">
      <div class="form-card contact-card">
        <h2 style="font-size:1.4rem">חנות המפעל והמעדנייה – שילת</h2>
        <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><a href="{{waze:shilat}}" target="_blank" rel="noopener">{{address:shilat}}</a></div>
        <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><a href="tel:{{phoneIntl}}">{{phone}}</a></div>
        <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><a href="mailto:{{email}}">{{email}}</a></div>
        <h3 style="font-size:1.05rem;margin-top:8px">שעות החנות</h3>
        {{hours:shilat}}
        <p class="small muted mb-0">שעות המשרד: {{officeHours}}</p>
      </div>
      <div class="form-card contact-card">
        <h2 style="font-size:1.4rem">סניף שרונה מרקט – תל אביב</h2>
        <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><a href="{{waze:sarona}}" target="_blank" rel="noopener">{{address:sarona}}</a></div>
        <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><a href="tel:+97235252552">03-5252552</a></div>
        {{hours:sarona}}
      </div>
    </div>
    <form class="form-card" data-form="פנייה מהאתר" novalidate>
      <h2>שלחו לנו הודעה</h2>
      <div class="form-grid">
        <div class="field"><label for="c-name">שם *</label><input id="c-name" name="name" type="text" autocomplete="name" required></div>
        <div class="field"><label for="c-phone">טלפון *</label><input id="c-phone" name="phone" type="tel" autocomplete="tel" required></div>
        <div class="field"><label for="c-email">אימייל</label><input id="c-email" name="email" type="email" autocomplete="email"></div>
        <div class="field"><label for="c-topic">נושא הפנייה</label><select id="c-topic" name="topic"><option>פנייה כללית</option><option>הזמנה קיימת</option><option>מתעניין במוצר</option><option>ביטול הזמנה</option></select></div>
        <div class="field"><label for="c-msg">הודעה *</label><textarea id="c-msg" name="message" required></textarea></div>
      </div>
      <button type="submit" class="btn btn--primary btn--block mt-2">שליחה</button>
      <p class="small muted mt-2 mb-0">או ישירות <a href="https://wa.me/{{whatsapp}}">בוואטסאפ {{whatsappDisplay}}</a></p>
      <div class="form-status" role="status" aria-live="polite"></div>
    </form>
  </div>
</section>
