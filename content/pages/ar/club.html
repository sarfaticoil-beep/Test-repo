hero_title: نادي زبائن صرفاتي

<section class="section">
  <div class="narrow">
    <form class="form-card" data-form="الانضمام إلى نادي الزبائن" novalidate>
      <h2>للانضمام املؤوا النموذج</h2>
      <div class="form-grid two">
        <div class="field"><label for="cl-first">الاسم الأول *</label><input id="cl-first" name="first_name" type="text" autocomplete="given-name" required></div>
        <div class="field"><label for="cl-last">اسم العائلة *</label><input id="cl-last" name="last_name" type="text" autocomplete="family-name" required></div>
        <div class="field"><label for="cl-phone">الهاتف *</label><input id="cl-phone" name="phone" type="tel" autocomplete="tel" required></div>
        <div class="field"><label for="cl-email">البريد الإلكتروني</label><input id="cl-email" name="email" type="email" autocomplete="email"></div>
        <div class="field"><label for="cl-bday">تاريخ الميلاد</label><input id="cl-bday" name="birthday" type="date"></div>
        <div class="field"><label for="cl-anniv">تاريخ الزواج</label><input id="cl-anniv" name="anniversary" type="date"></div>
        <label class="check full"><input type="checkbox" name="consent" required> <span>أوافق على أن ترسل لي Sarfati Smokers Ltd. رسائل إعلانية بالبريد الإلكتروني أو الرسائل النصية أو أي وسيلة إلكترونية أخرى، وفقًا للقانون. أعلم أنه يمكنني إلغاء الاشتراك في أي وقت. *</span></label>
      </div>
      <button type="submit" class="btn btn--gold btn--block mt-2">انضمام</button>
      <p class="small muted mt-2 mb-0">يحقّ لصرفاتي تغيير مزايا النادي وفق تقديرها. تُحفظ بياناتكم وفق <a href="{{link:terms}}">سياسة الخصوصية</a>.</p>
      <div class="form-status" role="status" aria-live="polite"></div>
    </form>
  </div>
</section>
